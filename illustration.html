<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Wizard Hack & Slash Prototype</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#111;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  #wrap{position:relative;width:100%;height:100%;background:#181818}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  #hud{position:absolute;left:12px;top:10px;right:12px;display:flex;justify-content:space-between;pointer-events:none;font-weight:700;text-shadow:0 2px 4px #000}
  #leftHud,#rightHud{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .pill{padding:6px 10px;border:1px solid #777;border-radius:999px;background:rgba(0,0,0,.45);font-size:13px}
  #sanityWrap{position:absolute;left:12px;right:12px;bottom:10px;pointer-events:none}
  #sanityLabel{display:flex;justify-content:space-between;font-size:12px;font-weight:800;margin-bottom:4px;text-shadow:0 2px 4px #000}
  #sanityBar{height:12px;border:1px solid #777;background:#222;border-radius:999px;overflow:hidden}
  #sanityFill{height:100%;width:100%;background:#ddd;transition:width .15s linear}
  #controls{position:absolute;inset:0;pointer-events:none}
  .pad{position:absolute;bottom:34px;width:140px;height:140px;pointer-events:auto;touch-action:none}
  #movePad{left:18px}
  #actionPad{right:18px}
  .stickBase{position:absolute;left:10px;top:10px;width:120px;height:120px;border:2px solid #777;border-radius:50%;background:rgba(255,255,255,.05)}
  .stickKnob{position:absolute;left:45px;top:45px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.35);border:2px solid #bbb}
  .actionBtn{position:absolute;width:78px;height:78px;border-radius:50%;border:2px solid #aaa;background:rgba(255,255,255,.12);color:#fff;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;user-select:none}
  #dashBtn{right:0;bottom:18px}
  #levelPanel{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.6);z-index:8}
  #levelCard{width:min(92vw,420px);background:#1d1d1d;border:1px solid #777;border-radius:18px;padding:18px}
  #levelCard h2{margin:0 0 12px;font-size:22px}
  .choice{display:block;width:100%;margin:10px 0;padding:14px 12px;border-radius:12px;border:1px solid #777;background:#2a2a2a;color:#fff;text-align:left;font-size:16px}
  .choice small{display:block;color:#bbb;margin-top:3px}
  #hint{position:absolute;left:50%;top:46px;transform:translateX(-50%);font-size:12px;color:#bbb;pointer-events:none;white-space:nowrap}

  #grabOverlay{
    position:absolute;left:0;right:0;top:0;bottom:36px;display:none;z-index:7;
    background:rgba(0,0,0,.72);
    align-items:center;justify-content:center;
    touch-action:none;user-select:none;
  }
  #grabScene{
    position:relative;
    height:min(62vh,430px);
    width:min(72vw,520px);
    display:flex;
    align-items:flex-end;
    justify-content:center;
    pointer-events:none;
  }
  #grabCharacter{
    height:100%;
    width:auto;
    max-width:100%;
    object-fit:contain;
    pointer-events:none;
    user-select:none;
    -webkit-user-drag:none;
  }
  #grabGaugeWrap{
    position:absolute;
    left:50%;
    top:2%;
    transform:translateX(-50%);
    width:min(76vw,430px);
    text-align:center;
    pointer-events:none;
  }
  #grabCount{
    font-size:15px;
    font-weight:900;
    margin-bottom:6px;
    text-shadow:0 2px 5px #000;
  }
  #grabBar{
    height:18px;
    background:rgba(15,15,15,.88);
    border:2px solid #ddd;
    border-radius:999px;
    overflow:hidden;
    box-shadow:0 2px 8px rgba(0,0,0,.5);
  }
  #grabFill{
    height:100%;
    width:0%;
    background:#eee;
  }
  #grabSanityTxt{
    margin-top:6px;
    font-size:12px;
    font-weight:800;
    color:#ddd;
    text-shadow:0 2px 5px #000;
  }
  .pulse{animation:pulse .16s ease-out}
  @keyframes pulse{0%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.035)}100%{transform:translateX(-50%) scale(1)}}

  #gameOverOverlay{
    position:absolute;inset:0;display:none;z-index:20;
    background:rgba(0,0,0,.82);
    align-items:center;justify-content:center;text-align:center;
    touch-action:none;
  }
  #gameOverCard{
    width:min(86vw,340px);
    padding:24px 20px;
    border:2px solid #bbb;
    border-radius:18px;
    background:#171717;
  }
  #gameOverTitle{font-size:36px;font-weight:950;letter-spacing:.08em;margin-bottom:10px}
  #gameOverSub{font-size:14px;color:#ccc;margin-bottom:16px}
  #restartBtn{
    width:100%;min-height:48px;border-radius:12px;border:1px solid #888;
    background:#2b2b2b;color:#fff;font-size:17px;font-weight:800;
  }

  /* スマホ横持ち専用UI */
  body{overscroll-behavior:none}
  #rotateOverlay{
    position:fixed;inset:0;z-index:100;display:none;
    align-items:center;justify-content:center;text-align:center;
    background:#111;color:#fff;padding:24px;
  }
  #rotateCard{
    max-width:320px;padding:24px 20px;border:1px solid #777;
    border-radius:18px;background:#1b1b1b;font-weight:800;
  }
  #rotateIcon{font-size:48px;margin-bottom:10px}
  #rotateText{font-size:18px;line-height:1.5}
  @media (orientation:landscape){
    #hud{
      left:max(12px,env(safe-area-inset-left));
      right:max(12px,env(safe-area-inset-right));
      top:max(8px,env(safe-area-inset-top));
    }
    #movePad{
      left:max(18px,calc(env(safe-area-inset-left) + 10px));
      bottom:max(34px,calc(env(safe-area-inset-bottom) + 24px));
    }
    #actionPad{
      right:max(18px,calc(env(safe-area-inset-right) + 10px));
      bottom:max(34px,calc(env(safe-area-inset-bottom) + 24px));
    }
    #sanityWrap{
      left:max(12px,env(safe-area-inset-left));
      right:max(12px,env(safe-area-inset-right));
      bottom:max(8px,env(safe-area-inset-bottom));
    }
    #hint{top:max(46px,calc(env(safe-area-inset-top) + 42px))}
    #levelCard{
      width:min(72vw,560px);
      max-height:88vh;
      overflow:auto;
      padding:14px 16px;
    }
    #levelCard h2{font-size:20px;margin-bottom:8px}
    .choice{margin:7px 0;padding:10px 11px;font-size:15px}
  }
  @media (orientation:portrait){
    #rotateOverlay{display:flex}
    #wrap{visibility:hidden}
  }

  #characterPortrait{
    position:absolute;
    right:max(8px,env(safe-area-inset-right));
    bottom:max(32px,calc(env(safe-area-inset-bottom) + 24px));
    height:min(68vh,520px);
    width:auto;
    z-index:3;
    pointer-events:none;
    user-select:none;
    -webkit-user-drag:none;
  }
  @media (orientation:portrait){#characterPortrait{display:none}}

</style>
</head>

  </div>

  const grabCount = document.getElementById('grabCount');
  const grabSanityTxt = document.getElementById('grabSanityTxt');
  const controls = document.getElementById('controls');
  const gameOverOverlay = document.getElementById('gameOverOverlay');
  const restartBtn = document.getElementById('restartBtn');

  let W=0,H=0,dpr=1,last=0;
  const world={w:2200,h:1400,margin:140};
  const camera={x:0,y:0};
  function resize(){
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    canvas.width = Math.floor(W*dpr);
    canvas.height = Math.floor(H*dpr);
    canvas.style.width = W+'px';
    canvas.style.height = H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  addEventListener('resize', resize);
  resize();

  const player = {
    x:world.w*.5,y:world.h*.5,r:15,
    sanity:100,maxSanity:100,
    atk:13,
    speed:220,
    level:1,xp:0,xpNeed:100,
    fireInterval:.52,fireCd:.2,explosiveCd:-1,
    dashCd:0,dashTime:0,invuln:0,
    facingX:1,facingY:0,
    kills:0,
    grabbed:false,
    grabProgress:0,
    grabTapPower:9,
    grabEnemy:null,
    grabSanityDrain:5,

    // レアスキル：爆発弾
    explosiveOwned:false,
    explosiveLevel:0,
    explosiveBaseDamage:13*1.5
  };

  let enemies=[];
  let projectiles=[];
  let pickups=[];
  let wave=1;
  let spawnTimer=0;
  let pausedForLevel=false;
  let gameOver=false;

  function rand(a,b){return a+Math.random()*(b-a)}

  function spawnSanityPickup(x,y){
    pickups.push({
      type:'sanity',
      x,y,
      r:9,
      heal:18,
      life:12,
      bob:Math.random()*Math.PI*2
    });
  }

  function spawnXpDrops(x,y){
    const count = Math.random()<0.5 ? 2 : 3;
    for(let i=0;i<count;i++){
      const a=Math.random()*Math.PI*2;
      const d=14+Math.random()*24;
      pickups.push({
        type:'xp',
        x:x+Math.cos(a)*d,
        y:y+Math.sin(a)*d,
        r:6,
        xp:5,
        life:20,
        bob:Math.random()*Math.PI*2
      });
    }
  }

  function maybeSpawnExplosiveSkill(x,y){
    // 未取得時のみ低確率で出現。取得後は二度とドロップしない。
    if(player.explosiveOwned)return;
    if(pickups.some(p=>p.type==='skill_explosive'))return;

    if(Math.random()<0.025){
      pickups.push({
        type:'skill_explosive',
        x,y,
        r:11,
        life:30,
        bob:Math.random()*Math.PI*2
      });
    }
  }

  function explosiveDamage(){
    // Lv1で初期通常弾(13)の150%。以後Lvごとに約25%ずつ強化。
    return player.explosiveBaseDamage * (1 + (player.explosiveLevel-1)*0.25);
  }

  function explosiveRadius(){
    // Lv1=62px、Lv5=126px
    return 62 + (player.explosiveLevel-1)*16;
  }

  function prepareLevelChoices(){
    // 爆発弾取得後、Lv5未満なら20%でレベルアップ候補に追加。
    const canOffer = player.explosiveOwned && player.explosiveLevel<5 && Math.random()<0.20;
    explosiveUpgradeChoice.style.display = canOffer ? 'block' : 'none';

    if(canOffer){
      const nextLv=player.explosiveLevel+1;
      explosiveUpgradeText.textContent =
        `Lv${nextLv}へ：威力 ${Math.round(player.explosiveBaseDamage*(1+(nextLv-1)*0.25))} / 範囲 ${62+(nextLv-1)*16}`;
    }
  }

  function spawnEnemy(){
    // マップ端からは出さない。プレイヤーの周囲、かつ画面外寄りの安全な距離に出す。
    const minSpawn=360;
    const maxSpawn=620;
    let x=player.x, y=player.y;

    for(let tries=0;tries<24;tries++){
      const a=Math.random()*Math.PI*2;
      const d=rand(minSpawn,maxSpawn);
      const tx=player.x+Math.cos(a)*d;
      const ty=player.y+Math.sin(a)*d;

      if(
        tx>world.margin && tx<world.w-world.margin &&
        ty>world.margin && ty<world.h-world.margin
      ){
        x=tx;y=ty;break;
      }
    }

    // 近くに適切な地点がなければ、マップ内部にランダム配置。
    if(x===player.x && y===player.y){
      x=rand(world.margin,world.w-world.margin);
      y=rand(world.margin,world.h-world.margin);
    }

    const isFast = Math.random() < (1/6); // 通常敵:高速敵 = 約5:1
    const hp = isFast ? Math.max(18,Math.floor((22+wave*5)*0.70)) : 22+wave*5;

    enemies.push({
      x,y,
      r:isFast?10:13,
      hp,maxHp:hp,
      speed:isFast ? (190+wave*7+Math.random()*35) : (65+wave*4+Math.random()*18),
      dmg:isFast ? Math.max(4,Math.floor((8+wave*.8)*0.7)) : 8+Math.floor(wave*.8),
      hitCd:0,
      grabCd:isFast ? rand(1.8,3.2) : rand(4.5,8.0),
      grabWarning:0,
      grabActive:0,
      dashGrab:false,
      dashVx:0,
      dashVy:0,
      dashTime:0,
      grabbing:false,
      type:isFast?'fast':'normal'
    });
  }

  function nearestEnemy(){
    let best=null,bestD=Infinity;
    for(const e of enemies){
      const dx=e.x-player.x,dy=e.y-player.y;
      const d=dx*dx+dy*dy;
      if(d<bestD){bestD=d;best=e}
    }
    return best;
  }

  function fireNormal(){
    const target=nearestEnemy();
    if(!target)return false;
    const dx=target.x-player.x;
    const dy=target.y-player.y;
    const len=Math.hypot(dx,dy)||1;
    projectiles.push({
      kind:'normal',
      x:player.x+dx/len*18,
      y:player.y+dy/len*18,
      vx:dx/len*420,
      vy:dy/len*420,
      speed:420,
      turn:0.65,
      r:6,
      life:3.6,
      target
    });
    return true;
  }

  function fireExplosive(){
    if(!player.explosiveOwned)return false;
    const target=nearestEnemy();
    if(!target)return false;
    const dx=target.x-player.x;
    const dy=target.y-player.y;
    const len=Math.hypot(dx,dy)||1;
    projectiles.push({
      kind:'explosive',
      x:player.x+dx/len*18,
      y:player.y+dy/len*18,
      vx:dx/len*360,
      vy:dy/len*360,
      speed:360,
      turn:0.42,
      r:8,
      life:3.8,
      target
    });
    return true;
  }

  function dash(){
    if(pausedForLevel||player.grabbed||player.dashCd>0)return;
    player.dashCd=1.1;
    player.dashTime=.16;
    player.invuln=.22;
  }

  function gainXp(v){
    player.xp+=v;
    if(player.xp>=player.xpNeed){
      player.xp-=player.xpNeed;
      player.level++;
      player.xpNeed=Math.floor(player.xpNeed*1.35);
      pausedForLevel=true;
      prepareLevelChoices();
      levelPanel.style.display='flex';
    }
  }

  function startGrab(e){
    if(player.grabbed || player.invuln>0) return;
    player.grabbed=true;
    player.grabProgress=0;
    player.grabEnemy=e;
    e.grabbing=true;

    grabFill.style.width='0%';
    grabCount.textContent='0%';
    characterPortrait.style.display='none';
    grabOverlay.style.display='flex';
    controls.style.display='none';
  }

  function escapeGrab(){
    player.grabbed=false;
    player.invuln=1.5;

    if(player.grabEnemy){
      const e=player.grabEnemy;
      e.grabbing=false;
      e.grabCd=rand(5.0,8.5);
      const dx=player.x-e.x;
      const dy=player.y-e.y;
      const len=Math.hypot(dx,dy)||1;
      player.x+=dx/len*54;
      player.y+=dy/len*54;
    }

    player.grabEnemy=null;
    grabOverlay.style.display='none';
    characterPortrait.style.display='';
    controls.style.display='block';
  }

  function tapEscape(){
    if(!player.grabbed)return;

    player.grabProgress=Math.min(100,player.grabProgress+player.grabTapPower);
    grabFill.style.width=player.grabProgress+'%';
    grabCount.textContent=`${Math.floor(player.grabProgress)}%`;

    grabGaugeWrap.classList.remove('pulse');
    void grabGaugeWrap.offsetWidth;
    grabGaugeWrap.classList.add('pulse');

    if(player.grabProgress>=100) escapeGrab();
  }

  grabOverlay.addEventListener('pointerdown',e=>{
    e.preventDefault();
    tapEscape();
  });

  levelPanel.addEventListener('click',e=>{
    const btn=e.target.closest('.choice');
    if(!btn)return;
    const up=btn.dataset.up;
    if(up==='atk')player.atk+=4;
    if(up==='rate')player.fireInterval=Math.max(.16,player.fireInterval*.88);
    if(up==='speed')player.speed*=1.08;
    if(up==='hp'){player.maxSanity+=25;player.sanity=player.maxSanity}
    if(up==='explosive' && player.explosiveOwned && player.explosiveLevel<5){
      player.explosiveLevel++;
    }
    explosiveUpgradeChoice.style.display='none';
    pausedForLevel=false;
    levelPanel.style.display='none';
  });

  const keys={};
  addEventListener('keydown',e=>{
    keys[e.key.toLowerCase()]=true;
    if(player.grabbed){
      if(e.code==='Space' || e.key==='Enter') tapEscape();
      return;
    }
    if(e.key.toLowerCase()==='shift')dash();
  });
  addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

  let stickX=0,stickY=0,stickId=null;
  const movePad=document.getElementById('movePad');
  const moveKnob=document.getElementById('moveKnob');

  function updateStick(e){
    const r=movePad.getBoundingClientRect();
    const cx=r.left+r.width/2,cy=r.top+r.height/2;
    let dx=e.clientX-cx,dy=e.clientY-cy;
    const max=42,len=Math.hypot(dx,dy)||1;
    if(len>max){dx=dx/len*max;dy=dy/len*max}
    stickX=dx/max;stickY=dy/max;
    moveKnob.style.transform=`translate(${dx}px,${dy}px)`;
  }

  movePad.addEventListener('pointerdown',e=>{
    stickId=e.pointerId;
    movePad.setPointerCapture(e.pointerId);
    updateStick(e);
  });
  movePad.addEventListener('pointermove',e=>{
    if(e.pointerId===stickId)updateStick(e);
  });
  function endStick(e){
    if(e.pointerId!==stickId)return;
    stickId=null;stickX=0;stickY=0;
    moveKnob.style.transform='translate(0,0)';
  }
  movePad.addEventListener('pointerup',endStick);
  movePad.addEventListener('pointercancel',endStick);

  document.getElementById('dashBtn').addEventListener('pointerdown',e=>{
    e.preventDefault();dash();
  });

  restartBtn.addEventListener('pointerdown',e=>{
    e.preventDefault();
    resetGame();
  });

  function killEnemyAt(index,e){
    if(!enemies.includes(e))return;
    if(Math.random()<0.28) spawnSanityPickup(e.x,e.y);
    maybeSpawnExplosiveSkill(e.x,e.y);
    spawnXpDrops(e.x,e.y);
    enemies.splice(index,1);
    player.kills++;
  }

  function explodeAt(x,y,damage,radius){
    // 爆心付近の敵すべてにダメージ。
    for(let j=enemies.length-1;j>=0;j--){
      const e=enemies[j];
      const dx=e.x-x,dy=e.y-y;
      if(dx*dx+dy*dy<=radius*radius){
        e.hp-=damage;
        if(e.hp<=0) killEnemyAt(j,e);
      }
    }

    // 短時間の爆発表示
    pickups.push({
      type:'explosion_fx',
      x,y,
      r:radius,
      life:.18,
      maxLife:.18,
      bob:0
    });
  }

  function updateProjectiles(dt){
    for(let i=projectiles.length-1;i>=0;i--){
      const p=projectiles[i];
      p.life-=dt;
      if(p.life<=0){projectiles.splice(i,1);continue}

      if(p.target && p.target.hp>0 && enemies.includes(p.target)){
        const dx=p.target.x-p.x;
        const dy=p.target.y-p.y;
        const len=Math.hypot(dx,dy)||1;
        const desiredX=dx/len*p.speed;
        const desiredY=dy/len*p.speed;
        const blend=Math.min(1,p.turn*dt);
        p.vx+=(desiredX-p.vx)*blend;
        p.vy+=(desiredY-p.vy)*blend;
        const vl=Math.hypot(p.vx,p.vy)||1;
        p.vx=p.vx/vl*p.speed;
        p.vy=p.vy/vl*p.speed;
      }else{
        p.target=null;
      }

      p.x+=p.vx*dt;
      p.y+=p.vy*dt;

      let hit=false;
      for(let j=enemies.length-1;j>=0;j--){
        const e=enemies[j];
        const dx=e.x-p.x,dy=e.y-p.y;
        if(dx*dx+dy*dy<(e.r+p.r)*(e.r+p.r)){
          hit=true;

          if(p.kind==='explosive'){
            explodeAt(p.x,p.y,explosiveDamage(),explosiveRadius());
          }else{
            e.hp-=player.atk;
            if(e.hp<=0) killEnemyAt(j,e);
          }
          break;
        }
      }

      if(hit)projectiles.splice(i,1);
    }
  }

  function update(dt){
    if(gameOver)return;
    if(pausedForLevel)return;

    // 拘束中はゲーム世界を完全停止。
    // 理性は減り続け、脱出ゲージは理性が低いほど激しく減衰する。
    if(player.grabbed){
      player.sanity=Math.max(0,player.sanity-player.grabSanityDrain*dt);

      const sanityRatio=player.maxSanity>0 ? player.sanity/player.maxSanity : 0;
      const escapeDecay=6 + (1-sanityRatio)*(1-sanityRatio)*36;
      player.grabProgress=Math.max(0,player.grabProgress-escapeDecay*dt);

      grabFill.style.width=player.grabProgress+'%';
      grabCount.textContent=`${Math.floor(player.grabProgress)}%`;

      if(player.sanity<=0){
        player.sanity=0;
        triggerGameOver();
      }
      return;
    }

    player.fireCd-=dt;
    if(player.explosiveCd>=0) player.explosiveCd-=dt;
    player.dashCd=Math.max(0,player.dashCd-dt);
    player.dashTime=Math.max(0,player.dashTime-dt);
    player.invuln=Math.max(0,player.invuln-dt);

    let mx=stickX,my=stickY;
    if(keys['a']||keys['arrowleft'])mx-=1;
    if(keys['d']||keys['arrowright'])mx+=1;
    if(keys['w']||keys['arrowup'])my-=1;
    if(keys['s']||keys['arrowdown'])my+=1;

    const len=Math.hypot(mx,my);
    if(len>0){
      mx/=len;my/=len;
      player.facingX=mx;player.facingY=my;
      const mult=player.dashTime>0?2.8:1;

      // 理性50%以上は通常速度。
      // 50%未満から理性低下に応じて滑らかに減速する。
      const sanityRatio=player.maxSanity>0 ? player.sanity/player.maxSanity : 0;
      const sanityMoveFactor = sanityRatio>=0.5
        ? 1
        : 0.27 + 0.73*(sanityRatio/0.5);

      const currentMoveSpeed=player.speed*sanityMoveFactor;
      player.x+=mx*currentMoveSpeed*mult*dt;
      player.y+=my*currentMoveSpeed*mult*dt;
    }

    player.x=Math.max(world.margin,Math.min(world.w-world.margin,player.x));
    player.y=Math.max(world.margin,Math.min(world.h-world.margin,player.y));

    if(player.fireCd<=0 && enemies.length){
      if(fireNormal()){
        player.fireCd=player.fireInterval;

        // 爆発弾は通常弾のちょうど裏拍（半間隔後）に発射。
        if(player.explosiveOwned){
          player.explosiveCd=player.fireInterval*.5;
        }
      }
    }

    if(player.explosiveOwned && player.explosiveCd<=0 && player.explosiveCd!=-1 && enemies.length){
      fireExplosive();
      player.explosiveCd=-1;
    }

    spawnTimer-=dt;
    const cap=Math.min(14+wave*3,48);
    if(spawnTimer<=0&&enemies.length<cap){
      spawnEnemy();
      spawnTimer=Math.max(.10,.58-wave*.025);
    }

    wave=1+Math.floor(player.kills/18);

    // ドロップアイテム（理性回復 / 経験値 / レアスキル）
    for(let i=pickups.length-1;i>=0;i--){
      const p=pickups[i];
      p.life-=dt;

      if(p.type==='explosion_fx'){
        if(p.life<=0) pickups.splice(i,1);
        continue;
      }

      p.bob+=dt*4;
      const pdx=player.x-p.x, pdy=player.y-p.y;

      // 経験値だけ取得範囲を広めにする。
      // そばを通り抜けるだけでも回収できる程度。
      const pickupRange = p.type==='xp'
        ? player.r+p.r+42
        : player.r+p.r+4;

      if(Math.hypot(pdx,pdy)<pickupRange){
        if(p.type==='xp'){
          gainXp(p.xp);
        }else if(p.type==='skill_explosive'){
          player.explosiveOwned=true;
          player.explosiveLevel=1;
          player.explosiveCd=-1;
        }else{
          player.sanity=Math.min(player.maxSanity,player.sanity+p.heal);
        }
        pickups.splice(i,1);
        continue;
      }

      if(p.life<=0) pickups.splice(i,1);
    }

    for(const e of enemies){
      e.hitCd=Math.max(0,e.hitCd-dt);
      e.grabCd=Math.max(0,e.grabCd-dt);

      const dx=player.x-e.x,dy=player.y-e.y;
      const dist=Math.hypot(dx,dy)||1;

      // 高速敵の突進拘束：警告1秒静止 → プレイヤー方向へ超高速突進 → 接触で拘束
      if(e.type==='fast'){
        if(e.dashGrab){
          e.dashTime-=dt;
          e.x+=e.dashVx*dt;
          e.y+=e.dashVy*dt;

          const ddx=player.x-e.x, ddy=player.y-e.y;
          const ddist=Math.hypot(ddx,ddy)||1;

          if(ddist<player.r+e.r+5 && player.invuln<=0){
            e.dashGrab=false;
            startGrab(e);
            continue;
          }

          if(e.dashTime<=0){
            e.dashGrab=false;
            e.grabCd=rand(1.8,3.2);
          }
          continue;
        }

        if(e.grabWarning>0){
          e.grabWarning-=dt;

          // 高速敵は警告中その場に完全停止
          if(e.grabWarning<=0){
            const tx=player.x-e.x, ty=player.y-e.y;
            const tlen=Math.hypot(tx,ty)||1;
            const dashSpeed=980;
            e.dashVx=tx/tlen*dashSpeed;
            e.dashVy=ty/tlen*dashSpeed;
            e.dashTime=Math.hypot(W,H)/dashSpeed*1.15;
            e.dashGrab=true;
          }
          continue;
        }

        // 「！」を出す瞬間だけ、敵が実際に画面内にいることを要求する。
        // 警告開始後は画面外へ出てもキャンセルせず、そのまま突進まで実行する。
        const sx=e.x-camera.x;
        const sy=e.y-camera.y;

        // 画面内でも外周付近では警告を出さない。
        // 中央寄り約75%の領域に入った高速敵だけ「！」を開始する。
        const warnMarginX=W*.125;
        const warnMarginY=H*.125;
        const inWarningZone =
          sx>=warnMarginX && sx<=W-warnMarginX &&
          sy>=warnMarginY && sy<=H-warnMarginY;

        if(e.grabCd<=0 && inWarningZone){
          e.grabWarning=1.0;
          continue;
        }

        e.x+=dx/dist*e.speed*dt;
        e.y+=dy/dist*e.speed*dt;
      }else{
        // 通常敵：警告1秒追跡 → その場で0.5秒の範囲拘束
        if(e.grabActive>0){
          e.grabActive-=dt;

          const adx=player.x-e.x, ady=player.y-e.y;
          const adist=Math.hypot(adx,ady)||1;

          if(adist<72.5 && player.invuln<=0){
            startGrab(e);
            e.grabActive=0;
          }else if(e.grabActive<=0){
            e.grabCd=rand(4.5,7.0);
          }
          continue;
        }

        if(e.grabWarning>0){
          e.grabWarning-=dt;

          e.x+=dx/dist*e.speed*dt;
          e.y+=dy/dist*e.speed*dt;

          if(e.grabWarning<=0){
            e.grabActive=.5;
          }
          continue;
        }

        if(e.grabCd<=0 && dist<120){
          e.grabWarning=1.0;
          continue;
        }

        e.x+=dx/dist*e.speed*dt;
        e.y+=dy/dist*e.speed*dt;
      }

      if(dist<player.r+e.r+2&&e.hitCd<=0&&player.invuln<=0){
        e.hitCd=.7;
        player.sanity-=e.dmg;
        const kx=(player.x-e.x)/dist,ky=(player.y-e.y)/dist;
        player.x+=kx*18;player.y+=ky*18;
        if(player.sanity<0)player.sanity=0;
      }
    }

    updateProjectiles(dt);
  }


  function triggerGameOver(){
    if(gameOver)return;
    gameOver=true;
    player.grabbed=false;
    grabOverlay.style.display='none';
    characterPortrait.style.display='';
    controls.style.display='none';
    gameOverOverlay.style.display='flex';
  }

  function resetGame(){
    player.sanity=100;player.maxSanity=100;
    player.atk=13;player.speed=220;
    player.fireInterval=.52;player.fireCd=.2;player.explosiveCd=-1;
    player.level=1;player.xp=0;player.xpNeed=100;player.kills=0;
    player.x=world.w*.5;player.y=world.h*.5;
    player.dashCd=0;player.dashTime=0;player.invuln=1;
    player.grabbed=false;player.grabProgress=0;player.grabEnemy=null;
    player.explosiveOwned=false;player.explosiveLevel=0;
    explosiveUpgradeChoice.style.display='none';
    enemies=[];projectiles=[];pickups=[];wave=1;spawnTimer=0;
    gameOver=false;
    grabOverlay.style.display='none';
    characterPortrait.style.display='';
    gameOverOverlay.style.display='none';
    controls.style.display='block';
  }

  function updateCamera(){
    // プレイヤーをなるべく中央に置きつつ、マップ端ではカメラだけ止める。
    const maxX=Math.max(0,world.w-W);
    const maxY=Math.max(0,world.h-H);
    camera.x=Math.max(0,Math.min(maxX,player.x-W*.5));
    camera.y=Math.max(0,Math.min(maxY,player.y-H*.5));
  }

  function drawGrid(){
    ctx.fillStyle='#171717';
    ctx.fillRect(0,0,W,H);

    // ワールド座標を画面へ変換したグリッド。
    ctx.strokeStyle='#262626';
    ctx.lineWidth=1;
    const s=48;
    const startX=Math.floor(camera.x/s)*s;
    const startY=Math.floor(camera.y/s)*s;
    ctx.beginPath();
    for(let x=startX;x<=camera.x+W+s;x+=s){
      const sx=x-camera.x;
      ctx.moveTo(sx,0);ctx.lineTo(sx,H);
    }
    for(let y=startY;y<=camera.y+H+s;y+=s){
      const sy=y-camera.y;
      ctx.moveTo(0,sy);ctx.lineTo(W,sy);
    }
    ctx.stroke();

    // マップ外周
    ctx.strokeStyle='#555';
    ctx.lineWidth=4;
    ctx.strokeRect(-camera.x,-camera.y,world.w,world.h);
  }

  function draw(){
    updateCamera();
    drawGrid();

    for(const p of pickups){
      const sx=p.x-camera.x;
      const sy=p.y-camera.y + Math.sin(p.bob||0)*3;

      if(p.type==='explosion_fx'){
        const t=Math.max(0,p.life/p.maxLife);
        ctx.beginPath();
        ctx.arc(sx,sy,p.r*(1-t*.15),0,Math.PI*2);
        ctx.fillStyle=`rgba(255,150,45,${0.28*t})`;
        ctx.fill();
        ctx.lineWidth=3;
        ctx.strokeStyle=`rgba(255,220,120,${0.75*t})`;
        ctx.stroke();
      }else if(p.type==='skill_explosive'){
        ctx.save();
        ctx.translate(sx,sy);
        ctx.rotate(performance.now()*.002);
        ctx.beginPath();
        for(let k=0;k<8;k++){
          const a=Math.PI*2*k/8;
          const rr=k%2===0?p.r+5:p.r-2;
          const px=Math.cos(a)*rr, py=Math.sin(a)*rr;
          if(k===0)ctx.moveTo(px,py); else ctx.lineTo(px,py);
        }
        ctx.closePath();
        ctx.fillStyle='#ff8a2a';
        ctx.fill();
        ctx.lineWidth=2;
        ctx.strokeStyle='#fff0bf';
        ctx.stroke();
        ctx.restore();
      }else if(p.type==='xp'){
        ctx.save();
        ctx.translate(sx,sy);
        ctx.rotate(Math.PI/4);
        ctx.fillStyle='rgba(250,204,21,.20)';
        ctx.fillRect(-p.r-4,-p.r-4,(p.r+4)*2,(p.r+4)*2);
        ctx.fillStyle='#facc15';
        ctx.fillRect(-p.r,-p.r,p.r*2,p.r*2);
        ctx.strokeStyle='#fff7b2';
        ctx.lineWidth=2;
        ctx.strokeRect(-p.r,-p.r,p.r*2,p.r*2);
        ctx.restore();
      }else{
        ctx.beginPath();
        ctx.arc(sx,sy,p.r+4,0,Math.PI*2);
        ctx.fillStyle='rgba(103,232,249,.16)';
        ctx.fill();

        ctx.beginPath();
        ctx.arc(sx,sy,p.r,0,Math.PI*2);
        ctx.fillStyle='#67e8f9';
        ctx.fill();
        ctx.lineWidth=2;
        ctx.strokeStyle='#dffcff';
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(sx-4,sy);
        ctx.lineTo(sx+4,sy);
        ctx.moveTo(sx,sy-4);
        ctx.lineTo(sx,sy+4);
        ctx.strokeStyle='#083344';
        ctx.lineWidth=2;
        ctx.stroke();
      }
    }

    for(const p of projectiles){
      ctx.beginPath();
      ctx.arc(p.x-camera.x,p.y-camera.y,p.r+4,0,Math.PI*2);
      ctx.fillStyle=p.kind==='explosive'
        ? 'rgba(255,140,50,.24)'
        : 'rgba(170,130,255,.18)';
      ctx.fill();

      ctx.beginPath();
      ctx.arc(p.x-camera.x,p.y-camera.y,p.r,0,Math.PI*2);
      ctx.fillStyle=p.kind==='explosive'?'#ff8a2a':'#cbb7ff';
      ctx.fill();
    }

    for(const e of enemies){
      ctx.beginPath();
      ctx.arc(e.x-camera.x,e.y-camera.y,e.r,0,Math.PI*2);
      ctx.fillStyle=e.type==='fast'?'#b35a2d':'#8a2d2d';
      ctx.fill();

      if(e.type==='fast'){
        ctx.beginPath();
        ctx.moveTo(e.x-camera.x-e.r-7,e.y-camera.y);
        ctx.lineTo(e.x-camera.x-e.r-18,e.y-camera.y-5);
        ctx.moveTo(e.x-camera.x-e.r-7,e.y-camera.y+6);
        ctx.lineTo(e.x-camera.x-e.r-18,e.y-camera.y+11);
        ctx.strokeStyle='rgba(255,180,120,.8)';
        ctx.lineWidth=2;
        ctx.stroke();
      }

      if(e.grabWarning>0){
        ctx.font='900 32px system-ui';
        ctx.textAlign='center';
        ctx.fillStyle='#fff';
        ctx.strokeStyle='#000';
        ctx.lineWidth=6;
        ctx.strokeText('!',e.x-camera.x,e.y-camera.y-e.r-27);
        ctx.fillText('!',e.x-camera.x,e.y-camera.y-e.r-27);

        if(e.type==='fast'){
          ctx.beginPath();
          ctx.arc(e.x-camera.x,e.y-camera.y,24,0,Math.PI*2);
          ctx.strokeStyle='rgba(255,120,70,.9)';
          ctx.lineWidth=3;
          ctx.stroke();
        }
      }

      if(e.type!=='fast' && e.grabActive>0){
        // 通常敵の範囲拘束
        ctx.beginPath();
        ctx.arc(e.x-camera.x,e.y-camera.y,72.5,0,Math.PI*2);
        ctx.fillStyle='rgba(255,70,70,.18)';
        ctx.fill();
        ctx.strokeStyle='rgba(255,80,80,.9)';
        ctx.lineWidth=4;
        ctx.stroke();

        ctx.font='900 24px system-ui';
        ctx.textAlign='center';
        ctx.fillStyle='#fff';
        ctx.strokeStyle='#000';
        ctx.lineWidth=5;
        ctx.strokeText('GRAB',e.x-camera.x,e.y-camera.y-e.r-26);
        ctx.fillText('GRAB',e.x-camera.x,e.y-camera.y-e.r-26);
      }

      if(e.type==='fast' && e.dashGrab){
        ctx.beginPath();
        ctx.moveTo(e.x-camera.x,e.y-camera.y);
        ctx.lineTo(e.x-camera.x-e.dashVx*.035,e.y-camera.y-e.dashVy*.035);
        ctx.strokeStyle='rgba(255,120,70,.75)';
        ctx.lineWidth=5;
        ctx.stroke();
      }

      ctx.fillStyle='#000';
      ctx.fillRect(e.x-camera.x-16,e.y-camera.y-e.r-10,32,4);
      ctx.fillStyle='#ddd';
      ctx.fillRect(e.x-camera.x-16,e.y-camera.y-e.r-10,32*(e.hp/e.maxHp),4);
    }

    ctx.save();
    ctx.translate(player.x-camera.x,player.y-camera.y);
    ctx.globalAlpha=player.invuln>0?.5+.5*Math.sin(performance.now()/40):1;

    ctx.beginPath();
    ctx.arc(0,3,player.r,0,Math.PI*2);
    ctx.fillStyle='#e6e6e6';
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(-14,-8);
    ctx.lineTo(0,-31);
    ctx.lineTo(14,-8);
    ctx.closePath();
    ctx.fillStyle='#777';
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(-18,-8);
    ctx.lineTo(18,-8);
    ctx.strokeStyle='#aaa';
    ctx.lineWidth=4;
    ctx.stroke();
    ctx.restore();

    xpTxt.textContent=`${Math.max(0,Math.floor(player.xp))}/${player.xpNeed}`;
    lvTxt.textContent=player.level;
    atkTxt.textContent=player.atk;
    killTxt.textContent=player.kills;
    waveTxt.textContent=wave;
    enemyTxt.textContent=enemies.length;
    const sanityPct=Math.max(0,Math.min(100,player.sanity/player.maxSanity*100));
    sanityFill.style.width=sanityPct+'%';
    sanityTxt.textContent=`${Math.max(0,Math.ceil(player.sanity))}/${player.maxSanity}`;
    grabSanityTxt.textContent=`理性 ${Math.max(0,Math.ceil(player.sanity))}/${player.maxSanity}`;
  }

  function loop(t){
    const dt=Math.min((t-last)/1000||0,.033);
    last=t;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  requestAnimationFrame(loop);
})();
</script>
